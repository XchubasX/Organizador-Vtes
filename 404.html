<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo...</title>
<script>
  // Enlaces por ciudad ("rutas bonitas"): .../Zaragoza no es un archivo real, así que
  // el servidor muestra este archivo (404.html). Aquí se toma la ciudad de la dirección
  // y se manda a la página principal con ?city=Zaragoza (ver initCityFromUrl en js/arranque.js).
  //
  // Funciona en los dos tipos de dirección:
  //  - GitHub Pages:   xchubasx.github.io/Organizador-Vtes/Zaragoza  (primero va el nombre del repositorio)
  //  - Dominio propio o Cloudflare: elysium-uat.pages.dev/Zaragoza   (la ciudad va directo)
  // Si llega con la marca ?desde=github (mudanza.js), se conserva para el aviso de mudanza.
  function destino404(host, ruta, busqueda) {
    var partes = ruta.split('/').filter(Boolean);
    var base = '/';
    if (/\.github\.io$/i.test(host) && partes.length) base = '/' + partes.shift() + '/';
    var ciudad = partes.length ? partes[0] : '';
    try { ciudad = decodeURIComponent(ciudad); } catch (e) {}
    var marca = /(^|[?&])desde=github(&|$)/.test(busqueda || '') ? 'desde=github' : '';
    var q = (ciudad ? 'city=' + encodeURIComponent(ciudad) : '') + (ciudad && marca ? '&' : '') + marca;
    return base + (q ? '?' + q : '');
  }
  window.location.replace(destino404(window.location.hostname, window.location.pathname, window.location.search));
</script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 40px; color: #888;">Redirigiendo...</p>
</body>
</html>
